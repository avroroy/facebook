<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Know?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
    overflow:hidden;
}

.card{
    width:90%;
    max-width:360px;
    background:rgba(255,255,255,.95);
    border-radius:25px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    animation:fadeUp 1s ease;
}

h1{
    color:#ff4b6e;
    font-size:32px;
    margin-bottom:20px;
}

h2{
    color:#444;
    margin-bottom:15px;
}

p{
    color:#666;
    font-size:17px;
    line-height:1.6;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    background:#ff4b6e;
    color:#fff;
    padding:14px 28px;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
    animation:pulse 1.5s infinite;
}

.btn:hover{
    background:#ff2f57;
    transform:scale(1.05);
}

.heart{
    font-size:45px;
    animation:beat .8s infinite alternate;
    margin-bottom:15px;
}

@keyframes beat{
    from{transform:scale(1);}
    to{transform:scale(1.2);}
}

@keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,75,110,.5);}
    70%{box-shadow:0 0 0 18px rgba(255,75,110,0);}
    100%{box-shadow:0 0 0 0 rgba(255,75,110,0);}
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.circle{
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
}

.c1{
    top:-60px;
    left:-60px;
}

.c2{
    bottom:-80px;
    right:-80px;
}
</style>

</head>
<body>

<div class="circle c1"></div>
<div class="circle c2"></div>

<div class="card">

<div class="heart">❤️</div>

<h1>Do You Know?</h1>

<h2>I Love A Girl ❤️</h2>

<p>
If you want to know who she is,<br><br>
Click the button below.
</p>

<a class="btn" href="https://shorturl.at/n62E1">
Click Here
</a>

</div>

</body>
</html>
